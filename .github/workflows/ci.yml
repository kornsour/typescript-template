name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Centralized, standardized CI shared across the template-derived repos.
    # See github.com/kornsour/gh-automation.
    uses: kornsour/gh-automation/.github/workflows/ci.yml@8389ab51e28c3c75507f88009b78bf387ca811b1 # ci.yml pinned 2026-09-06
    with:
      migration-check: true

  adr-index:
    name: ADR index check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unique ADR numbers, complete index
        run: scripts/check-adr-index.sh
