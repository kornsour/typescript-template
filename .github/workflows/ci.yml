name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Centralized, standardized CI shared across the template-derived repos.
    # See github.com/kornsour/gh-automation.
    uses: kornsour/gh-automation/.github/workflows/ci.yml@b3c9725939d515a545219990f226bcfb1b754af6 # v1.1.0
    with:
      migration-check: true

  adr-index:
    name: ADR index check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unique ADR numbers, complete index
        run: scripts/check-adr-index.sh

  # mobile:begin
  mobile:
    # A required status check (.github/rulesets/default-branch.json): keep the
    # name in sync there, and don't add a path filter or `if:` — a required
    # check that never reports blocks every merge. See ADR-0026.
    name: Mobile (type check, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check, tests, Expo SDK version check
        # Offline: `expo install --check` then compares against the versions
        # shipped inside the installed `expo` package, so a new Expo patch
        # release can't turn this required check red on unrelated PRs. Run the
        # online check locally when upgrading (docs/setup/mobile.md).
        env:
          EXPO_OFFLINE: "1"
        run: pnpm mobile:check
      - name: Metro bundle check (Android + iOS)
        run: >-
          pnpm --filter mobile exec expo export
          --platform android --platform ios
          --output-dir "$RUNNER_TEMP/mobile-export"
  # mobile:end
