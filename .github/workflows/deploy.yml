name: Deploy

# Deploys the app to AWS with SST (ADR-0023). This replaces Vercel's git
# integration, which was the deploy trigger before the migration — without this
# workflow, nothing runs `sst deploy` and pushes to main never ship.
#
# Migrations run as an explicit step BEFORE the deploy, because the Vercel build
# hook that used to apply them (`pnpm build` → `pnpm db:deploy`, gated on the
# VERCEL env var) does not exist on AWS. Schema first, then the code that needs
# it.
#
# No-ops entirely until AWS is provisioned: set the `AWS_DEPLOY_ROLE_ARN` repo
# variable (Settings → Secrets and variables → Actions → Variables) to an IAM
# role that trusts GitHub's OIDC provider, plus the `DATABASE_URL`,
# `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ZONE_ID` secrets. See
# docs/adr/0023-aws-sst-deploy.md, and AWS-MIGRATION.md in the shared `.github`
# repo for the fleet-wide plan.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never cancel a deploy in flight — a half-applied CloudFormation update is a
# worse state than a queued one.
concurrency:
  group: ${{ github.workflow }}-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate + deploy (production)
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      # Required for the OIDC token exchange; without it the role assumption
      # fails with a confusing "Not authorized to perform sts:AssumeRoleWithWebIdentity".
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          # CloudFront reads ACM certificates from us-east-1 and nowhere else,
          # which is why every sst.config.ts in this fleet pins that region.
          aws-region: us-east-1

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE_DB_MIGRATIONS: "1"
        run: pnpm db:deploy

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: pnpm sst deploy --stage production
